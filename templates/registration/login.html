<!doctype html>
<html lang="uz">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>BCRM — Kirish</title>
    <style>
        *{box-sizing:border-box}
        body{margin:0;font-family:Inter,system-ui,sans-serif;background:#07111f;color:#e5eef8;min-height:100vh;display:grid;place-items:center}
        .card{width:min(420px,calc(100% - 32px));background:#101d2e;border:1px solid #23344b;border-radius:20px;padding:36px;box-shadow:0 24px 70px #0007}
        .logo{font-size:26px;font-weight:800;color:#fff}
        .logo span{color:#2dd4bf;margin-left:6px}
        p{color:#93a4b8;margin:8px 0 28px}
        label{display:block;font-size:13px;color:#b7c5d7;margin:16px 0 7px}
        input{width:100%;padding:13px 14px;border-radius:10px;border:1px solid #2b405a;background:#0a1524;color:#fff;font-size:15px}
        button{width:100%;border:0;border-radius:10px;margin-top:22px;padding:14px;background:#14b8a6;color:#03201d;font-weight:800;cursor:pointer}
        .errorlist{color:#fb7185;padding-left:18px}
    </style>
</head>
<body>
<form class="card" method="post">
    {% csrf_token %}
    <div class="logo">BCRM<span>textile</span></div>
    <p>Tizimga kirish uchun hisobingizdan foydalaning.</p>
    {{ form.non_field_errors }}
    <label for="id_username">Email</label>{{ form.username }}
    <label for="id_password">Parol</label>{{ form.password }}
    <button type="submit">Kirish</button>
</form>
</body>
</html>
